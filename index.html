<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해시태그 트래블 가이드북 시리즈</title>
  <style>
    :root {
      --primary-color: #e1306c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    /* 1. 상단 헤더 & 확대된 로고 */
    header {
      background: #ffffff;
      border-bottom: 1px solid #eee;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .logo-area {
      display: flex;
      align-items: center;
    }

    /* 로고 크기 확대 (기존 40px -> 65px) */
    .logo-img {
      height: 65px; 
      width: auto;
      object-fit: contain;
    }

    /* 2. 여행 테마 히어로 섹션 */
    .hero {
      text-align: center;
      padding: 4rem 1rem 3rem;
      background: linear-gradient(135deg, #fff0f5 0%, #e6f0ff 100%);
    }

    .hero-badge {
      display: inline-block;
      background: #ffffff;
      color: var(--primary-color);
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .hero h1 {
      font-size: 2.4rem;
      margin-bottom: 0.8rem;
      color: #111;
      word-break: keep-all;
    }

    .hero p {
      color: #555;
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
      word-break: keep-all;
    }

    /* 3. 가이드북 시리즈 목록 섹션 */
    .books-section {
      max-width: 1100px;
      margin: 3.5rem auto;
      padding: 0 1.5rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.8rem;
      border-left: 4px solid var(--primary-color);
      padding-left: 12px;
    }

    .section-title {
      font-size: 1.5rem;
      color: #111;
    }

    .book-count {
      font-size: 0.9rem;
      color: #777;
    }

    /* 도서 그리드 레아아웃 */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.8rem;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid #f0f0f0;
    }

    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .book-cover {
      width: 100%;
      height: 250px;
      background-color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 0.9rem;
      position: relative;
    }

    /* 표지 이미지가 업로드되면 표시되는 스타일 */
    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .book-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 0.4rem;
      color: #222;
      line-height: 1.4;
    }

    .book-desc {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1.2rem;
    }

    .btn-link {
      margin-top: auto;
      display: inline-block;
      text-align: center;
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-link:hover {
      background-color: #c8235a;
    }

    /* 4. 웹사이트 하단 소개 & 오른쪽 움직이는 로고 배치 */
    .bottom-section {
      max-width: 1100px;
      margin: 5rem auto 3rem;
      padding: 0 1.5rem;
    }

    .bottom-container {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      border: 1px solid #f0f0f0;
    }

    .bottom-text {
      flex: 1.3;
    }

    .bottom-text h2 {
      font-size: 1.7rem;
      margin-bottom: 1rem;
      color: #111;
      word-break: keep-all;
    }

    .bottom-text p {
      color: #555;
      font-size: 1rem;
      line-height: 1.7;
      word-break: keep-all;
    }

    /* 오른쪽에 배치된 움직이는 로고 비디오 */
    .bottom-video-wrapper {
      flex: 0.7;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .animated-logo-video {
      width: 100%;
      max-width: 240px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    footer {
      text-align: center;
      padding: 2.5rem;
      color: #888;
      font-size: 0.85rem;
      background: #fafafa;
      border-top: 1px solid #eee;
    }

    /* 모바일 반응형 처리 */
    @media (max-width: 768px) {
      .logo-img { height: 50px; }
      .hero h1 { font-size: 1.8rem; }
      .bottom-container {
        flex-direction: column;
        text-align: center;
        padding: 2rem;
      }
      .bottom-video-wrapper {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 (확대된 메인 로고) -->
  <header>
    <div class="logo-area">
      <img src="logo.png" alt="해시태그 트래블 가이드북 로고" class="logo-img">
    </div>
  </header>

  <!-- 히어로 섹션 (여행 가이드북 맞춤 문구) -->
  <section class="hero">
    <span class="hero-badge">✈️ HASHTAG TRAVEL GUIDEBOOK</span>
    <h1>자유 여행자를 위한 가장 똑똑한 가이드북</h1>
    <p>해쉬태그 트래블 시리즈와 함께 당신만의 특별하고 현명한 여행을 계획해 보세요.</p>
  </section>

  <!-- 도서 목록 섹션 -->
  <section class="books-section">
    <div class="section-header">
      <h2 class="section-title">가이드북 시리즈 전체 보기</h2>
      <span class="book-count" id="bookCount"></span>
    </div>
    
    <!-- 자바스크립트에 의해 책 카드가 자동으로 생성되어 들어갈 위치 -->
    <div class="book-grid" id="bookGrid"></div>
  </section>

  <!-- 맨 아래 하단 소개 섹션 (오른쪽 움직이는 MP4 로고 배치) -->
  <section class="bottom-section">
    <div class="bottom-container">
      
      <!-- 왼쪽: 안내 문구 -->
      <div class="bottom-text">
        <h2>여행의 시작부터 끝까지, 해쉬태그와 함께</h2>
        <p>
          주요 명소부터 숨겨진 로컬 스팟, 최신 여행 팁까지! <br>
          해쉬태그 트래블 가이드북 시리즈는 복잡한 정보 대신 여행자에게 꼭 필요한 핵심 내용만 알차게 담아냅니다.
        </p>
      </div>

      <!-- 오른쪽: 움직이는 MP4 로고 -->
      <div class="bottom-video-wrapper">
        <video class="animated-logo-video" autoplay loop muted playsinline>
          <source src="logo-animated.mp4" type="video/mp4">
        </video>
      </div>

    </div>
  </section>

  <footer>
    <p>© 해쉬태그 트래블 가이드북 시리즈. All rights reserved.</p>
  </footer>

  <!-- 책 목록을 쉽게 추가/관리하는 자바스크립트 코드 -->
  <script>
    // 💡 나중에 가이드북을 추가할 때 아래 배열 형식으로 항목만 계속 늘려주시면 됩니다!
    const books = [
      {
        title: "해쉬태그 가이드북 01",
        desc: "여행지 핵심 정보 & 추천 코스 모음",
        coverImg: "", // 이미지 파일이 있다면 "cover1.jpg" 같이 넣어주세요
        link: "https://www.aladin.co.kr/shop/common/wseriesitem.aspx?SRID=124804"
      },
      {
        title: "해쉬태그 가이드북 02",
        desc: "자유 여행자를 위한 실전 가이드",
        coverImg: "",
        link: "https://www.aladin.co.kr/shop/common/wseriesitem.aspx?SRID=124804"
      },
      {
        title: "해쉬태그 가이드북 03",
        desc: "숨은 로컬 스팟 & 맛집 완벽 정리",
        coverImg: "",
        link: "https://www.aladin.co.kr/shop/common/wseriesitem.aspx?SRID=124804"
      },
      {
        title: "해쉬태그 가이드북 04",
        desc: "한 권으로 떠나는 완벽 여행 코스",
        coverImg: "",
        link: "https://www.aladin.co.kr/shop/common/wseriesitem.aspx?SRID=124804"
      }
      // 필요할 때 여기 밑으로 복사해서 계속 추가하시면 됩니다.
    ];

    // 도서 카드를 화면에 그려주는 기능
    function renderBooks() {
      const grid = document.getElementById('bookGrid');
      const countLabel = document.getElementById('bookCount');
      
      countLabel.textContent = `총 ${books.length}권`;
      grid.innerHTML = '';

      books.forEach((book) => {
        const card = document.createElement('div');
        card.className = 'book-card';

        const coverHtml = book.coverImg 
          ? `<img src="${book.coverImg}" alt="${book.title}">`
          : `표지 준비중`;

        card.innerHTML = `
          <div class="book-cover">${coverHtml}</div>
          <div class="book-info">
            <div class="book-title">${book.title}</div>
            <div class="book-desc">${book.desc}</div>
            <a href="${book.link}" target="_blank" class="btn-link">알라딘에서 보기</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', renderBooks);
  </script>

</body>
</html>
